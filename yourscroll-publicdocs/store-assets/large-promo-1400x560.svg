<svg width="1400" height="560" viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg">
  <!-- Marquee promotional tile (1400x560), optional but required to be
       eligible for the store's featured placements. Illustration on the left
       is the watch page as YouScroll leaves it: player fixed, comments in a
       tall panel beside it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#262E3B"/>
      <stop offset="0.5" stop-color="#171A1F"/>
      <stop offset="1" stop-color="#0B0D11"/>
    </linearGradient>
    <linearGradient id="screen" x1="96" y1="120" x2="520" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2E3E5B"/>
      <stop offset="1" stop-color="#131821"/>
    </linearGradient>
    <linearGradient id="card" x1="548" y1="120" x2="548" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE3EE"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#FFFFFF" stroke-opacity="0.028"/>
    </pattern>
    <clipPath id="panelClip">
      <rect x="548" y="120" width="196" height="350" rx="14"/>
    </clipPath>
  </defs>

  <rect width="1400" height="560" fill="url(#bg)"/>
  <rect width="1400" height="560" fill="url(#grid)"/>
  <circle cx="1290" cy="70" r="210" fill="#FF2D46" opacity="0.09"/>
  <circle cx="120" cy="520" r="180" fill="#3D8BFD" opacity="0.07"/>

  <g filter="url(#lift)">
    <!-- Player: stays exactly where it is -->
    <rect x="96" y="120" width="424" height="238" rx="16" fill="url(#screen)"/>
    <circle cx="308" cy="232" r="40" fill="#FF2D46" opacity="0.16"/>
    <path d="M295 214 L332 232 L295 250 Z" fill="#FF2D46"/>
    <rect x="96" y="340" width="424" height="18" fill="#000" opacity="0.28"/>
    <rect x="96" y="340" width="158" height="4" fill="#FF2D46"/>

    <!-- Video metadata below it -->
    <rect x="96" y="378" width="300" height="13" rx="6.5" fill="#FFFFFF" opacity="0.55"/>
    <rect x="96" y="402" width="196" height="11" rx="5.5" fill="#FFFFFF" opacity="0.24"/>
    <circle cx="110" cy="446" r="15" fill="#FF2D46" opacity="0.75"/>
    <rect x="136" y="437" width="120" height="10" rx="5" fill="#FFFFFF" opacity="0.34"/>
    <rect x="136" y="454" width="78" height="8" rx="4" fill="#FFFFFF" opacity="0.18"/>

    <!-- The pinned panel: full height, scrolling on its own -->
    <rect x="548" y="120" width="196" height="350" rx="14" fill="url(#card)"/>
  </g>

  <g clip-path="url(#panelClip)">
    <rect x="548" y="120" width="196" height="46" fill="#0F1216"/>
    <rect x="566" y="136" width="72" height="14" rx="7" fill="#FFFFFF" opacity="0.92"/>
    <rect x="652" y="136" width="52" height="14" rx="7" fill="#FFFFFF" opacity="0.28"/>

    <g fill="#5A6472">
      <circle cx="578" cy="196" r="13" opacity="0.5"/>
      <circle cx="578" cy="268" r="13" opacity="0.5"/>
      <circle cx="578" cy="340" r="13" opacity="0.5"/>
      <circle cx="578" cy="412" r="13" opacity="0.5"/>
    </g>
    <g fill="#4A5261">
      <rect x="602" y="184" width="66" height="9" rx="4.5" opacity="0.55"/>
      <rect x="602" y="200" width="118" height="8" rx="4" opacity="0.3"/>
      <rect x="602" y="214" width="94" height="8" rx="4" opacity="0.3"/>

      <rect x="602" y="256" width="80" height="9" rx="4.5" opacity="0.55"/>
      <rect x="602" y="272" width="118" height="8" rx="4" opacity="0.3"/>
      <rect x="602" y="286" width="72" height="8" rx="4" opacity="0.3"/>

      <rect x="602" y="328" width="58" height="9" rx="4.5" opacity="0.55"/>
      <rect x="602" y="344" width="118" height="8" rx="4" opacity="0.3"/>
      <rect x="602" y="358" width="102" height="8" rx="4" opacity="0.3"/>

      <rect x="602" y="400" width="74" height="9" rx="4.5" opacity="0.55"/>
      <rect x="602" y="416" width="118" height="8" rx="4" opacity="0.3"/>
      <rect x="602" y="430" width="88" height="8" rx="4" opacity="0.3"/>
    </g>

    <!-- Its own scrollbar: the detail that says "this scrolls, the page does not" -->
    <rect x="731" y="176" width="5" height="240" rx="2.5" fill="#000" opacity="0.08"/>
    <rect x="731" y="176" width="5" height="96" rx="2.5" fill="#FF2D46" opacity="0.9"/>
  </g>

  <text x="836" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="78"
        font-weight="700" letter-spacing="-2" fill="#FFFFFF">YouScroll</text>
  <rect x="838" y="238" width="86" height="5" rx="2.5" fill="#FF2D46"/>
  <text x="836" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#C6CCD6">
    Comments beside the video, not below it.
  </text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#98A0AD">
    <rect x="838" y="330" width="10" height="10" rx="3" fill="#FF2D46"/>
    <text x="866" y="340">A full-height panel that scrolls on its own</text>
    <rect x="838" y="374" width="10" height="10" rx="3" fill="#FF2D46"/>
    <text x="866" y="384">Comments and Up Next, one click apart</text>
    <rect x="838" y="418" width="10" height="10" rx="3" fill="#FF2D46"/>
    <text x="866" y="428">No account, no analytics, no network requests</text>
  </g>
</svg>
